name: Halo deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: PPE operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - deploy-and-promote
          - prepare-windows-proof
          - restore-windows-idle

permissions:
  contents: read

jobs:
  resolve-sources:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' || inputs.operation == 'deploy-and-promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      openhands_repository: ${{ steps.sources.outputs.openhands_repository }}
      openhands_branch: ${{ steps.sources.outputs.openhands_branch }}
      openhands_sha: ${{ steps.sources.outputs.openhands_sha }}
      agent_server_repository: ${{ steps.sources.outputs.agent_server_repository }}
      agent_server_checkout_repository: ${{ steps.sources.outputs.agent_server_checkout_repository }}
      agent_server_branch: ${{ steps.sources.outputs.agent_server_branch }}
      agent_server_sha: ${{ steps.sources.outputs.agent_server_sha }}
      sandbox_server_repository: ${{ steps.sources.outputs.sandbox_server_repository }}
      sandbox_server_branch: ${{ steps.sources.outputs.sandbox_server_branch }}
      sandbox_server_sha: ${{ steps.sources.outputs.sandbox_server_sha }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Resolve integration branch heads
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          output="$(node scripts/halo-deploy.mjs resolve-sources)"
          printf '%s\n' "$output"
          for name in \
            OPENHANDS_SOURCE_REPOSITORY OPENHANDS_SOURCE_BRANCH OPENHANDS_SOURCE_SHA \
            AGENT_SERVER_SOURCE_REPOSITORY AGENT_SERVER_SOURCE_BRANCH AGENT_SERVER_SOURCE_SHA \
            SANDBOX_SERVER_SOURCE_REPOSITORY SANDBOX_SERVER_SOURCE_BRANCH SANDBOX_SERVER_SOURCE_SHA
          do
            value="$(printf '%s\n' "$output" | sed -n "s/^${name}=//p" | tail -1)"
            test -n "$value"
            output_name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed 's/_source_/_/')"
            echo "$output_name=$value" >> "$GITHUB_OUTPUT"
          done
          for sha in \
            "$(printf '%s\n' "$output" | sed -n 's/^OPENHANDS_SOURCE_SHA=//p')" \
            "$(printf '%s\n' "$output" | sed -n 's/^AGENT_SERVER_SOURCE_SHA=//p')" \
            "$(printf '%s\n' "$output" | sed -n 's/^SANDBOX_SERVER_SOURCE_SHA=//p')"
          do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          done
          agent_server_repository="$(printf '%s\n' "$output" | sed -n 's/^AGENT_SERVER_SOURCE_REPOSITORY=//p' | tail -1)"
          agent_server_checkout_repository="${agent_server_repository#https://github.com/}"
          agent_server_checkout_repository="${agent_server_checkout_repository%.git}"
          [[ "$agent_server_checkout_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          echo "agent_server_checkout_repository=$agent_server_checkout_repository" >> "$GITHUB_OUTPUT"

  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' || inputs.operation == 'deploy-and-promote'
    needs: resolve-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - test
          - build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-sources.outputs.openhands_sha }}

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        env:
          CHECK: ${{ matrix.check }}
        shell: bash
        run: |
          case "$CHECK" in
            lint)
              npm run lint
              ;;
            test)
              npm test -- --run \
                __tests__/scripts/halo-deploy.test.ts \
                __tests__/scripts/docker-sandbox-server-route.test.ts \
                __tests__/scripts/workspace-runtime-controller.test.ts \
                __tests__/scripts/static-server.test.ts \
                __tests__/github-workflows/halo-deploy.test.ts
              ;;
            build)
              npm run build
              ;;
            *)
              echo "::error::Unsupported validation check: $CHECK"
              exit 1
              ;;
          esac

  build-images:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' || inputs.operation == 'deploy-and-promote'
    needs: resolve-sources
    runs-on: openhands-halo-ci
    timeout-minutes: 120
    concurrency:
      group: halo-build
      cancel-in-progress: false
    outputs:
      canvas_digest: ${{ steps.image.outputs.canvas_digest }}
      agent_server_digest: ${{ steps.image.outputs.agent_server_digest }}
      sandbox_server_digest: ${{ steps.image.outputs.sandbox_server_digest }}
      sandbox_runtime_digest: ${{ steps.image.outputs.sandbox_runtime_digest }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-sources.outputs.openhands_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Configure in-cluster Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
          ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          test -s "$token_file"
          test -s "$ca_file"
          kubectl config set-cluster halo \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
            --certificate-authority="$ca_file" \
            --embed-certs=true
          kubectl config set-credentials halo-ci --token="$(cat "$token_file")"
          kubectl config set-context halo --cluster=halo --user=halo-ci
          kubectl config use-context halo

      - name: Build immutable image in AKS
        id: image
        shell: bash
        run: |
          set -euo pipefail
          output="$(node scripts/halo-deploy.mjs build --openhands-sha "${{ needs.resolve-sources.outputs.openhands_sha }}" --agent-server-sha "${{ needs.resolve-sources.outputs.agent_server_sha }}" --sandbox-server-sha "${{ needs.resolve-sources.outputs.sandbox_server_sha }}")"
          printf '%s\n' "$output"
          canvas_digest="$(printf '%s\n' "$output" | sed -n 's/^CANVAS_IMAGE_DIGEST=//p' | tail -1)"
          agent_server_digest="$(printf '%s\n' "$output" | sed -n 's/^AGENT_SERVER_IMAGE_DIGEST=//p' | tail -1)"
          sandbox_server_digest="$(printf '%s\n' "$output" | sed -n 's/^SANDBOX_SERVER_IMAGE_DIGEST=//p' | tail -1)"
          sandbox_runtime_digest="$(printf '%s\n' "$output" | sed -n 's/^SANDBOX_RUNTIME_IMAGE_DIGEST=//p' | tail -1)"
          if [[ ! "$canvas_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Halo build did not return an immutable Canvas image digest"
            exit 1
          fi
          if [[ ! "$sandbox_server_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Halo build did not return an immutable Sandbox Server image digest"
            exit 1
          fi
          if [[ ! "$agent_server_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Halo build did not return an immutable Agent Server image digest"
            exit 1
          fi
          if [[ ! "$sandbox_runtime_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Halo build did not return an immutable Linux sandbox runtime image digest"
            exit 1
          fi
          echo "canvas_digest=$canvas_digest" >> "$GITHUB_OUTPUT"
          echo "agent_server_digest=$agent_server_digest" >> "$GITHUB_OUTPUT"
          echo "sandbox_server_digest=$sandbox_server_digest" >> "$GITHUB_OUTPUT"
          echo "sandbox_runtime_digest=$sandbox_runtime_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Halo candidate provenance"
            echo
            echo "| Component | Repository | Branch | SHA | Image digest |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| Canvas | \`${{ needs.resolve-sources.outputs.openhands_repository }}\` | \`${{ needs.resolve-sources.outputs.openhands_branch }}\` | \`${{ needs.resolve-sources.outputs.openhands_sha }}\` | \`$canvas_digest\` |"
            echo "| Agent Server | \`${{ needs.resolve-sources.outputs.agent_server_repository }}\` | \`${{ needs.resolve-sources.outputs.agent_server_branch }}\` | \`${{ needs.resolve-sources.outputs.agent_server_sha }}\` | \`$agent_server_digest\` |"
            echo "| Sandbox Server | \`${{ needs.resolve-sources.outputs.sandbox_server_repository }}\` | \`${{ needs.resolve-sources.outputs.sandbox_server_branch }}\` | \`${{ needs.resolve-sources.outputs.sandbox_server_sha }}\` | \`$sandbox_server_digest\` |"
            echo "| Sandbox Runtime | \`${{ needs.resolve-sources.outputs.sandbox_server_repository }}\` + Agent Server | \`${{ needs.resolve-sources.outputs.sandbox_server_branch }}\` | \`${{ needs.resolve-sources.outputs.sandbox_server_sha }}\` + \`${{ needs.resolve-sources.outputs.agent_server_sha }}\` | \`$sandbox_runtime_digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows-runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' || inputs.operation == 'deploy-and-promote'
    needs: resolve-sources
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      windows_runtime_digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/halo-agent-server-windows
      IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/halo-agent-server-windows:${{ needs.resolve-sources.outputs.agent_server_sha }}-windows-ltsc2025-amd64
    steps:
      - name: Check out exact Agent Server commit
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve-sources.outputs.agent_server_checkout_repository }}
          ref: ${{ needs.resolve-sources.outputs.agent_server_sha }}

      - name: Start Windows Docker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service docker -ErrorAction Stop
          if ($service.Status -ne 'Running') {
            Start-Service docker
          }
          if ((docker info --format '{{.OSType}}').Trim() -ne 'windows') {
            throw 'The Windows runtime build requires a Windows container daemon.'
          }

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Server 2025 image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          docker build `
            --isolation process `
            --file openhands-agent-server\openhands\agent_server\docker\Dockerfile.windows `
            --build-arg OPENHANDS_BUILD_GIT_SHA=${{ needs.resolve-sources.outputs.agent_server_sha }} `
            --build-arg OPENHANDS_BUILD_GIT_REF=${{ needs.resolve-sources.outputs.agent_server_branch }} `
            --tag $env:IMAGE_TAG `
            .

      - name: Push immutable Windows image
        id: publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          docker push $env:IMAGE_TAG
          $repoDigest = docker image inspect `
            --format '{{index .RepoDigests 0}}' `
            $env:IMAGE_TAG
          if ([string]::IsNullOrWhiteSpace($repoDigest)) {
            throw 'The pushed Windows image did not report a repository digest.'
          }
          $digest = $repoDigest.Split('@')[-1]
          if ($digest -notmatch '^sha256:[a-f0-9]{64}$') {
            throw "Invalid Windows image digest: $digest"
          }
          "digest=$digest" >> $env:GITHUB_OUTPUT

      - name: Verify anonymous Windows image pull
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = (
            Invoke-RestMethod `
              -Uri "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/halo-agent-server-windows:pull"
          ).token
          $response = Invoke-WebRequest `
            -Method Head `
            -Uri "https://ghcr.io/v2/${{ github.repository_owner }}/halo-agent-server-windows/manifests/${{ steps.publish.outputs.digest }}" `
            -Headers @{
              Authorization = "Bearer $token"
              Accept = "application/vnd.oci.image.manifest.v1+json"
            }
          if ($response.Headers['Docker-Content-Digest'] -ne '${{ steps.publish.outputs.digest }}') {
            throw "Anonymous Windows image digest mismatch: $($response.Headers['Docker-Content-Digest'])"
          }

  windows-preflight:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' || inputs.operation == 'deploy-and-promote'
    needs:
      - resolve-sources
      - build-windows-runtime
    runs-on: openhands-halo-ci
    timeout-minutes: 30
    environment: halo-ppe
    concurrency:
      group: halo-windows-preflight
      cancel-in-progress: false
    outputs:
      windows_runtime_digest: ${{ steps.windows-runtime.outputs.digest }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-sources.outputs.openhands_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure in-cluster Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
          ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          test -s "$token_file"
          test -s "$ca_file"
          kubectl config set-cluster halo \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
            --certificate-authority="$ca_file" \
            --embed-certs=true
          kubectl config set-credentials halo-ci --token="$(cat "$token_file")"
          kubectl config set-context halo --cluster=halo --user=halo-ci
          kubectl config use-context halo

      - name: Resolve immutable Windows runtime
        id: windows-runtime
        env:
          WINDOWS_RUNTIME_DIGEST: ${{ needs.build-windows-runtime.outputs.windows_runtime_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$WINDOWS_RUNTIME_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::The Windows runtime build did not return an immutable digest"
            exit 1
          fi
          echo "digest=$WINDOWS_RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Preflight Windows runtime image and identity
        run: node scripts/halo-deploy.mjs preflight-windows --windows-runtime-digest "${{ steps.windows-runtime.outputs.digest }}"

  deploy-candidate:
    needs:
      - resolve-sources
      - validate
      - build-images
      - windows-preflight
    runs-on: openhands-halo-ci
    timeout-minutes: 120
    environment: halo-ppe
    concurrency:
      group: halo-candidate
      cancel-in-progress: false
    outputs:
      canvas_digest: ${{ needs.build-images.outputs.canvas_digest }}
      agent_server_digest: ${{ needs.build-images.outputs.agent_server_digest }}
      sandbox_server_digest: ${{ needs.build-images.outputs.sandbox_server_digest }}
      sandbox_runtime_digest: ${{ needs.build-images.outputs.sandbox_runtime_digest }}
      windows_runtime_digest: ${{ needs.windows-preflight.outputs.windows_runtime_digest }}
      openhands_repository: ${{ needs.resolve-sources.outputs.openhands_repository }}
      openhands_branch: ${{ needs.resolve-sources.outputs.openhands_branch }}
      openhands_sha: ${{ needs.resolve-sources.outputs.openhands_sha }}
      agent_server_repository: ${{ needs.resolve-sources.outputs.agent_server_repository }}
      agent_server_branch: ${{ needs.resolve-sources.outputs.agent_server_branch }}
      agent_server_sha: ${{ needs.resolve-sources.outputs.agent_server_sha }}
      sandbox_server_repository: ${{ needs.resolve-sources.outputs.sandbox_server_repository }}
      sandbox_server_branch: ${{ needs.resolve-sources.outputs.sandbox_server_branch }}
      sandbox_server_sha: ${{ needs.resolve-sources.outputs.sandbox_server_sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-sources.outputs.openhands_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Configure in-cluster Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
          ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          test -s "$token_file"
          test -s "$ca_file"
          kubectl config set-cluster halo \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
            --certificate-authority="$ca_file" \
            --embed-certs=true
          kubectl config set-credentials halo-ci --token="$(cat "$token_file")"
          kubectl config set-context halo --cluster=halo --user=halo-ci
          kubectl config use-context halo

      - name: Deploy candidate digest
        run: node scripts/halo-deploy.mjs deploy-candidate --canvas-digest "${{ needs.build-images.outputs.canvas_digest }}" --agent-server-digest "${{ needs.build-images.outputs.agent_server_digest }}" --sandbox-server-digest "${{ needs.build-images.outputs.sandbox_server_digest }}" --sandbox-runtime-digest "${{ needs.build-images.outputs.sandbox_runtime_digest }}" --windows-runtime-digest "${{ needs.windows-preflight.outputs.windows_runtime_digest }}"

      - name: Verify candidate access boundary
        shell: bash
        run: |
          set -euo pipefail
          base_url=http://openhands-halo.openhands-halo-ppe.svc.cluster.local:8000
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$base_url/ready"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Candidate service did not become reachable from the runner"
              exit 1
            fi
            sleep 2
          done
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$base_url/api/v1/sandboxes")"
          test "$status" = "401"

      - name: Verify private Hindsight boundary
        shell: bash
        run: |
          set -euo pipefail
          base_url=http://openhands-hindsight.openhands-halo-ppe.svc.cluster.local:8888
          kubectl rollout status deployment/openhands-hindsight \
            --namespace openhands-halo-ppe \
            --timeout=120s
          kubectl exec -i \
            --namespace openhands-halo-ppe \
            deployment/openhands-sandbox-server \
            -- python - <<'PY'
          import urllib.error
          import urllib.request

          base_url = (
              "http://openhands-hindsight.openhands-halo-ppe.svc.cluster.local:8888"
          )
          with urllib.request.urlopen(f"{base_url}/health", timeout=5) as response:
              assert response.status == 200
          try:
              urllib.request.urlopen(f"{base_url}/v1/default/banks", timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError("Hindsight data endpoint accepted no credentials")
          PY
          if curl --fail --silent --show-error \
            --connect-timeout 2 \
            --max-time 5 \
            "$base_url/health"; then
            echo "::error::Private Hindsight service was reachable from the CI runner"
            exit 1
          fi

  promote-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-and-promote'
    needs:
      - validate
      - deploy-candidate
    runs-on: openhands-halo-ci
    timeout-minutes: 30
    environment: halo-production
    concurrency:
      group: halo-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Configure in-cluster Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
          ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          test -s "$token_file"
          test -s "$ca_file"
          kubectl config set-cluster halo \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
            --certificate-authority="$ca_file" \
            --embed-certs=true
          kubectl config set-credentials halo-ci --token="$(cat "$token_file")"
          kubectl config set-context halo --cluster=halo --user=halo-ci
          kubectl config use-context halo

      - name: Promote the candidate digest
        run: node scripts/halo-deploy.mjs promote --canvas-digest "${{ needs.deploy-candidate.outputs.canvas_digest }}" --agent-server-digest "${{ needs.deploy-candidate.outputs.agent_server_digest }}" --sandbox-server-digest "${{ needs.deploy-candidate.outputs.sandbox_server_digest }}" --sandbox-runtime-digest "${{ needs.deploy-candidate.outputs.sandbox_runtime_digest }}" --windows-runtime-digest "${{ needs.deploy-candidate.outputs.windows_runtime_digest }}"

  manage-windows-proof-capacity:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'prepare-windows-proof' || inputs.operation == 'restore-windows-idle')
    runs-on: openhands-halo-ci
    timeout-minutes: 15
    environment: halo-ppe
    concurrency:
      group: halo-candidate
      cancel-in-progress: false
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure in-cluster Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
          ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          test -s "$token_file"
          test -s "$ca_file"
          kubectl config set-cluster halo \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
            --certificate-authority="$ca_file" \
            --embed-certs=true
          kubectl config set-credentials halo-ci --token="$(cat "$token_file")"
          kubectl config set-context halo --cluster=halo --user=halo-ci
          kubectl config use-context halo

      - name: Set Windows proof warm-pool capacity
        env:
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "prepare-windows-proof" ]; then
            replicas=1
          else
            replicas=0
          fi
          kubectl -n openhands-halo-ppe patch sandboxwarmpool windows-server-2025-amd64 \
            --type merge \
            --patch "{\"spec\":{\"replicas\":$replicas}}"
          actual="$(kubectl -n openhands-halo-ppe get sandboxwarmpool windows-server-2025-amd64 -o jsonpath='{.spec.replicas}')"
          test "$actual" = "$replicas"
